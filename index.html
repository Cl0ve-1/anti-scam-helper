<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>安心防詐助手</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif; }
    body { background: #FAF7F2; color: #1F2937; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 18px 40px; }
    .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 16px; }
    
    .header { text-align: center; padding-top: 4px; }
    .header h1 { font-size: 28px; color: #111827; margin-bottom: 6px; }
    .header p { font-size: 18px; color: #4B5563; line-height: 1.5; }

    .lang-bar { display: flex; justify-content: center; gap: 10px; }
    .lang-btn { padding: 8px 18px; border-radius: 999px; border: 2px solid #D1D5DB; background: #FFF; font-size: 16px; font-weight: bold; color: #374151; cursor: pointer; }
    .lang-btn.active { border-color: #D97706; background: #FEF3C7; color: #92400E; }

    /* 核心大按鈕：語音求救 */
    .voice-btn {
      width: 100%; padding: 32px 20px; border: none; border-radius: 26px;
      background: linear-gradient(145deg, #EA580C, #DC2626); color: #FFF;
      font-size: 26px; font-weight: 800; line-height: 1.4;
      box-shadow: 0 10px 25px rgba(220, 38, 38, 0.28);
      cursor: pointer; transition: transform 0.15s;
    }
    .voice-btn:active { transform: scale(0.97); }
    .voice-btn.recording { background: linear-gradient(145deg, #B91C1C, #7F1D1D); animation: pulse 1.2s infinite; }
    .voice-sub { display: block; font-size: 17px; font-weight: 500; opacity: 0.92; margin-top: 8px; }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.45); }
      50% { box-shadow: 0 0 0 18px rgba(220, 38, 38, 0); }
    }

    /* 獨立顯示：剛才聽到你說什麼 */
    .heard-box {
      display: none; background: #FFFBEB; border: 2px solid #F59E0B;
      border-radius: 18px; padding: 16px 18px;
    }
    .heard-box.show { display: block; }
    .heard-label { font-size: 16px; font-weight: 700; color: #B45309; margin-bottom: 6px; }
    .heard-text { font-size: 21px; font-weight: 600; color: #1F2937; line-height: 1.5; word-break: break-word; }

    /* 回覆與安撫卡片 */
    .result-box { display: none; border-radius: 20px; padding: 22px; line-height: 1.6; font-size: 21px; font-weight: 600; }
    .result-box.high { display: block; background: #FEF2F2; border: 3px solid #DC2626; color: #991B1B; }
    .result-box.safe { display: block; background: #ECFDF5; border: 3px solid #10B981; color: #065F46; }
    .replay-btn { margin-top: 14px; padding: 10px 18px; border-radius: 12px; border: none; background: #1F2937; color: #FFF; font-size: 17px; cursor: pointer; }

    /* 緊急直接通知家人 */
    .quick-sos-btn {
      width: 100%; padding: 18px; border: 2px solid #DC2626; border-radius: 18px;
      background: #FEF2F2; color: #B91C1C; font-size: 21px; font-weight: 800; cursor: pointer;
    }

    /* 獨立的短訊貼上區 */
    .card { background: #FFF; border-radius: 20px; padding: 18px; box-shadow: 0 4px 14px rgba(0,0,0,0.05); }
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .card label { font-size: 18px; font-weight: 700; color: #374151; }
    .clear-btn { padding: 6px 12px; border-radius: 8px; border: 1px solid #D1D5DB; background: #F9FAFB; font-size: 15px; color: #4B5563; cursor: pointer; }
    textarea { width: 100%; height: 100px; border: 2px solid #E5E7EB; border-radius: 14px; padding: 12px; font-size: 18px; resize: none; }
    .send-btn { width: 100%; margin-top: 12px; padding: 14px; border: none; border-radius: 14px; background: #2563EB; color: #FFF; font-size: 20px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🛡️ 安心防詐助手</h1>
      <p>遇到怪電話或害怕的事？<br>深呼吸，先按下面問一問</p>
    </div>

    <div class="lang-bar">
      <button class="lang-btn active" id="btn-yue" onclick="setLang('yue')">廣東話</button>
      <button class="lang-btn" id="btn-zh" onclick="setLang('zh')">普通話</button>
    </div>

    <button id="voiceBtn" class="voice-btn" onclick="toggleVoice()">
      🎤 按一下，講給我聽
      <span class="voice-sub" id="voiceSub">說完再按一下，馬上幫你查</span>
    </button>

    <!-- 獨立顯示語音辨識結果 -->
    <div id="heardBox" class="heard-box">
      <div class="heard-label" id="heardLabel">🗣️ 我聽到你說：</div>
      <div class="heard-text" id="heardText"></div>
    </div>

    <div id="resultBox" class="result-box">
      <div id="resultText"></div>
      <button class="replay-btn" onclick="speakText(lastReply)">🔊 再聽一次語音</button>
    </div>

    <button class="quick-sos-btn" onclick="triggerQuickSOS()">
      📞 我好害怕，直接叫家人打給我
    </button>

    <div class="card">
      <div class="card-top">
        <label for="msgInput">貼上可疑短訊 / 話術：</label>
        <button class="clear-btn" onclick="clearText()">清除</button>
      </div>
      <textarea id="msgInput" placeholder="長按這裡貼上可疑短訊，例如：說我帳戶被凍結、要我轉帳..."></textarea>
      <button class="send-btn" onclick="sendText()">幫我檢查這段短訊</button>
    </div>
  </div>

  <script>
    let langMode = 'yue'; // 'yue' 或 'zh'
    let isRecording = false;
    let recognition = null;
    let lastReply = '';
    let latestTranscript = '';

    function setLang(mode) {
      langMode = mode;
      document.getElementById('btn-yue').classList.toggle('active', mode === 'yue');
      document.getElementById('btn-zh').classList.toggle('active', mode === 'zh');
    }

    function getRecogLang() {
      return langMode === 'yue' ? 'yue-Hant-HK' : 'zh-CN';
    }

    function getTtsLang() {
      return langMode === 'yue' ? 'zh-HK' : 'zh-TW';
    }

    function speakText(text) {
      if (!('speechSynthesis' in window) || !text) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = getTtsLang();
      utter.rate = 0.9;
      window.speechSynthesis.speak(utter);
    }

    function toggleVoice() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('這個瀏覽器不支援直接語音輸入，請直接按紅色「叫家人打給我」按鈕，或在下方貼上文字。');
        return;
      }

      const btn = document.getElementById('voiceBtn');
      const sub = document.getElementById('voiceSub');
      const heardBox = document.getElementById('heardBox');
      const heardLabel = document.getElementById('heardLabel');
      const heardText = document.getElementById('heardText');

      if (!isRecording) {
        latestTranscript = '';
        recognition = new SpeechRecognition();
        recognition.lang = getRecogLang();
        recognition.interimResults = true;  // 開啟即時顯示你說的話
        recognition.continuous = false;

        recognition.onstart = () => {
          isRecording = true;
          btn.classList.add('recording');
          btn.firstChild.textContent = '⏹️ 正在聽你說...';
          sub.textContent = '講完請再按一下這裡';
          heardBox.classList.add('show');
          heardLabel.textContent = '🎤 正在聆聽中...';
          heardText.textContent = '（請直接開口說話）';
        };

        recognition.onresult = (event) => {
          let fullText = '';
          for (let i = 0; i < event.results.length; i++) {
            fullText += event.results[i][0].transcript;
          }
          latestTranscript = fullText.trim();
          heardText.textContent = latestTranscript || '（尚未聽到聲音）';
        };

        recognition.onerror = (e) => {
          heardLabel.textContent = '⚠️ 語音辨識中斷：';
          heardText.textContent = '沒聽清楚，請再按一次重說（或改用普通話試試）';
          stopUI();
        };

        recognition.onend = () => {
          stopUI();
          if (latestTranscript) {
            heardLabel.textContent = '🗣️ 我剛才聽到你說：';
            heardText.textContent = latestTranscript;
            sendSOS(latestTranscript);
          } else {
            heardLabel.textContent = '⚠️ 沒有聽到聲音';
            heardText.textContent = '請靠近麥克風再試一次';
          }
        };

        recognition.start();
      } else {
        recognition && recognition.stop();
      }
    }

    function stopUI() {
      isRecording = false;
      const btn = document.getElementById('voiceBtn');
      const sub = document.getElementById('voiceSub');
      btn.classList.remove('recording');
      btn.firstChild.textContent = '🎤 按一下，講給我聽';
      sub.textContent = '說完再按一下，馬上幫你查';
    }

    function clearText() {
      document.getElementById('msgInput').value = '';
    }

    function triggerQuickSOS() {
      document.getElementById('heardBox').classList.remove('show');
      sendSOS('長輩按下緊急求助按鈕，疑似遇到可疑狀況，請立刻致電關心！');
    }

    function sendText() {
      const text = document.getElementById('msgInput').value.trim();
      if (!text) {
        alert('請先貼上或輸入短訊內容喔！');
        return;
      }
      document.getElementById('heardBox').classList.remove('show');
      sendSOS(text);
    }

    async function sendSOS(message) {
      const box = document.getElementById('resultBox');
      const textEl = document.getElementById('resultText');
      box.className = 'result-box safe';
      textEl.textContent = '正在幫你檢查，別緊張，請稍等一下...';

      try {
        const res = await fetch('/api/sos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: 'elder_01', message })
        });
        const data = await res.json();
        lastReply = data.reply_message;
        box.className = 'result-box ' + (data.risk_level === 'high' ? 'high' : 'safe');
        textEl.textContent = data.reply_message;
        speakText(data.reply_message);
      } catch (err) {
        box.className = 'result-box high';
        textEl.textContent = '網路連線異常，請直接打電話給家人確認，千萬不要轉帳！';
      }
    }
  </script>
</body>
</html>
